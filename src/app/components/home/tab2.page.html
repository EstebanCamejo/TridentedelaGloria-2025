<ng-template #cargando>
  <div style="padding: 24px; text-align:center; opacity:.7;">
    <ion-spinner name="crescent"></ion-spinner>
    <div style="margin-top:8px;">CARGANDO PERFIL…</div>
  </div>
</ng-template>

<ng-container *ngIf="sesion.perfilCargado; else cargando">
  <!-- Admin (Dueño/Supervisor) -->
  <app-home-admin *ngIf="sesion.esDueno() || sesion.esSupervisor()"></app-home-admin>

  <!-- Maître -->
  <app-home-maitre *ngIf="sesion.esMaitre()"></app-home-maitre>

  <!-- Mozo -->
  <app-home-mozo *ngIf="sesion.esMozo()"></app-home-mozo>

  <!-- Bartender / Cocinero -->
  <app-home-bartender-cocinero *ngIf="sesion.esBartender() || sesion.esCocinero()"></app-home-bartender-cocinero>

  <!-- Repartidor -->
  <app-home-delivery *ngIf="sesion.esDelivery()"></app-home-delivery>

  <!-- Cliente -->
  <app-home-cliente *ngIf="sesion.esCliente()"></app-home-cliente>

  <!-- Fallback si cargó pero no hay perfil o no calza en ningún rol -->
  <div *ngIf="!sesion.usuarioBD" style="padding:16px; text-align:center; opacity:.8;">
    NO ENCONTRAMOS TU PERFIL. CONTACTÁ A UN SUPERVISOR PARA COMPLETAR EL ALTA.
  </div>
  
  <div *ngIf="sesion.usuarioBD && !sesion.esDueno() && !sesion.esSupervisor() && !sesion.esMaitre() && !sesion.esMozo() && !sesion.esCocinero() && !sesion.esBartender() && !sesion.esDelivery() && !sesion.esCliente()" style="padding:16px; text-align:center; opacity:.8;">
    ROL NO RECONOCIDO PARA: {{ sesion.usuarioBD?.email || 'USUARIO' }} (PERFIL: {{ sesion.usuarioBD?.perfil }})
  </div>
</ng-container>


  <!-- FAB Salir -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="fab-salir">
    <ion-fab-button color="danger" (click)="logOut()">
      <img src="assets/salirr.png" alt="Salir" />
    </ion-fab-button>
  </ion-fab>
