
<ion-header class="client-header">
  <ion-toolbar>
    <div class="nav-pill title-large">
      LISTA DE ESPERA
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
  </ion-refresher>

  <!-- Lista de espera (cards con swiper) -->
<div class="waitlist-container" *ngIf="!loading && items.length; else estado">
  <swiper-container
    #swiperEspera
    class="waitlist-swiper"
    slides-per-view="1"
    space-between="20"
    centered-slides="true"
    pagination="false"
    navigation="false"
    speed="300"
    (swiperslidechange)="onSlideChange($event)">
    <swiper-slide *ngFor="let it of items; trackBy: trackById">
      <ion-card class="wl-card">
        <!-- Barra superior: Prioridad -->
        <div class="wl-topbar">
          <div class="wl-prio">
            <span class="wl-prio-label">PRIORIDAD</span>
            <span class="wl-prio-value">{{ prioridadDe(it) }}</span>
          </div>
        </div>

        <!-- Cuerpo: avatar + nombre -->
        <div class="wl-body">
          <ion-avatar class="wl-avatar">
            <img [src]="it.foto_url || 'assets/imagenes/agregar-usuario.png'" alt="foto" />
          </ion-avatar>
          <div class="wl-info">
            <h3 class="wl-name">{{ primerNombre(it.nombre) }}</h3>
          </div>
        </div>

        <!-- Zona de acción: Asignar mesa -->
        <div class="wl-actions">
          <ion-button class="btn-asignar" fill="solid" expand="block" (click)="atender(it)">
            <ion-icon slot="start" name="reorder-three-outline"></ion-icon>
            ASIGNAR MESA
          </ion-button>
        </div>
      </ion-card>
    </swiper-slide>
  </swiper-container>
  
  <!-- Paginación personalizada -->
  <div *ngIf="items.length > 0" class="custom-pagination">
    <button 
      class="pagination-btn"
      (click)="goToPrevious(swiperEspera)"
      [disabled]="currentSlide === 0">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <div class="pagination-counter">
      {{ currentSlide + 1 }}/{{ items.length }}
    </div>
    <button 
      class="pagination-btn"
      (click)="goToNext(swiperEspera)"
      [disabled]="currentSlide === items.length - 1">
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </button>
  </div>
</div>

<!-- Estado (cargando / vacío) -->
<ng-template #estado>
  <div class="wl-state">
    <ng-container *ngIf="loading; else vacio">
      <div class="loading-message">CARGANDO LISTA DE ESPERA…</div>
    </ng-container>
    <ng-template #vacio>
      <div class="empty-message">
        <div class="empty-icon">📋</div>
        <div class="empty-title">¡LISTA DE ESPERA VACÍA!</div>
        <div class="empty-subtitle">NO HAY CLIENTES ESPERANDO</div>
        <div class="empty-description">TODOS LOS CLIENTES HAN SIDO ATENDIDOS EXITOSAMENTE</div>
      </div>
    </ng-template>
  </div>
</ng-template>

    <ion-fab-button color="danger" (click)="logOut()">
      <img src="assets/salirr.png" alt="Salir" />
    </ion-fab-button>
  </ion-fab> -->

</ion-content>
