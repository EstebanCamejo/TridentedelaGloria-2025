
   <ion-header>
  <ion-toolbar>
    <ion-title class="title-large">LISTA DE ESPERA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
  </ion-refresher>

  <!-- Lista de espera (cards compactas) -->
<div class="waitlist" *ngIf="!loading && items.length; else estado">
  <ion-card class="wl-card" *ngFor="let it of items; trackBy: trackById">
    
    <!-- Barra superior: Prioridad + timestamp / estado -->
    <div class="wl-topbar">
      <div class="wl-prio">
        <span class="wl-prio-label">Prioridad</span>
        <span class="wl-prio-value">{{ prioridadDe(it) }}</span>
      </div>
      <div class="wl-meta">
        <ion-badge color="warning" class="wl-status">en espera</ion-badge>
        <small class="wl-time">{{ it.created_at | date:'dd/MM, HH:mm' }}</small>
      </div>
    </div>

    <!-- Cuerpo: avatar + nombre + email -->
    <div class="wl-body">
      <ion-avatar class="wl-avatar">
        <img [src]="it.foto_url || 'assets/imagenes/agregar-usuario.png'" alt="foto" />
      </ion-avatar>
      <div class="wl-info">
        <h3 class="wl-name">{{ it.nombre }}</h3>
        <p class="wl-email" *ngIf="it.email">{{ it.email }}</p>
      </div>
    </div>

    <!-- Zona de acción: Asignar mesa -->
    <div class="wl-actions">
      <ion-button class="btn-asignar" fill="solid" expand="block" (click)="atender(it)">
  <ion-icon slot="start" name="reorder-three-outline"></ion-icon>
  Asignar mesa
</ion-button>

    </div>
  </ion-card>
</div>

<!-- Estado (cargando / vacío) -->
<ng-template #estado>
  <div class="wl-state">
    <ng-container *ngIf="loading; else vacio">
      <div class="loading-message">Cargando lista de espera…</div>
    </ng-container>
    <ng-template #vacio>
      <div class="empty-message">
        <div class="empty-icon">📋</div>
        <div class="empty-title">¡LISTA DE ESPERA VACÍA!</div>
        <div class="empty-subtitle">No hay clientes esperando</div>
        <div class="empty-description">Todos los clientes han sido atendidos exitosamente</div>
      </div>
    </ng-template>
  </div>
</ng-template>

    <ion-fab-button color="danger" (click)="logOut()">
      <img src="assets/salirr.png" alt="Salir" />
    </ion-fab-button>
  </ion-fab> -->

</ion-content>
