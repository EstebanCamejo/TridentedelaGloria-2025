<ion-header>
  <ion-toolbar>
    <ion-title>ESCANEAR MESA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Estado inicial / durante escaneo -->
  <ng-container *ngIf="!lastMesa; else resultado">
    <ion-button expand="block" (click)="escanear()" [disabled]="escaneando">
      <ion-icon slot="start" name="qr-code"></ion-icon>
      {{ escaneando ? 'ESCANEANDO…' : 'ESCANEAR QR DE MESA' }}
    </ion-button>

    <p *ngIf="escaneando" style="opacity:.7;margin-top:8px;">
      APUNTÁ LA CÁMARA AL QR…
    </p>

    <p *ngIf="!escanear && !escaneando" style="opacity:.7;margin-top:8px;">
      AL DETECTAR UNA MESA, TE MOSTRAREMOS EL NÚMERO Y PODRÁS ESCANEAR OTRA
    </p>
  </ng-container>

  <!-- Resultado + acción para repetir -->
  <ng-template #resultado>
    <p style="margin-bottom:12px;">
      MESA <strong>#{{ lastMesa?.numero }}</strong> DETECTADA CORRECTAMENTE
    </p>
    <ion-button expand="block" (click)="scanAgain()">
      ESCANEAR OTRO
    </ion-button>
  </ng-template>
</ion-content>
