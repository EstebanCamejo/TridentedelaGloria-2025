<ion-header>
    <ion-toolbar>
      <ion-title>MESA</ion-title>
    </ion-toolbar>
  </ion-header>
  
  <ion-content class="ion-padding">
    <ng-container *ngIf="!cargando && mesa; else cargandoTpl">
      <ion-item>
        <ion-label>
          <h2>MESA #{{ mesa.numero }}</h2>
          <p>CAPACIDAD: {{ mesa.capacidad }}</p>
          <p>TIPO: {{ mesa.tipo.toUpperCase() }}</p>
        </ion-label>
        <ion-badge [color]="mesa.estado === 'libre' ? 'success' : (mesa.estado === 'ocupada' ? 'danger' : 'medium')">
          {{ estadoTexto(mesa.estado) }}
        </ion-badge>
      </ion-item>
  
      <div *ngIf="mesa.foto_url" style="margin-top:16px;text-align:center;">
        <ion-img [src]="mesa.foto_url" style="max-width:320px;margin:0 auto;border-radius:12px;"></ion-img>
      </div>
  
      <!-- Botones futuros (asignar, marcar ocupada, etc.) -->
      <!--
      <ion-button expand="block" color="primary" style="margin-top:20px;">ASIGNAR</ion-button>
      -->
    </ng-container>
  
    <ng-template #cargandoTpl>
      CARGANDO INFORMACIÓN DE LA MESA...
    </ng-template>
  </ion-content>
