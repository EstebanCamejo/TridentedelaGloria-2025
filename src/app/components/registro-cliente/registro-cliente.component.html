
<div class="wrapper">
  <div class="contenedor-subidas">
  <div class="avatar-ctr">
    <img [src]="photoPreview || 'assets/imagenes/agregar-usuario.png'" alt="foto-perfil" />
  </div>

  <ion-button class="btn-subir" (click)="subirFotoClick()" type="button">
    <ion-icon name="camera"></ion-icon>
    <p>SUBIR FOTO</p>
  </ion-button>

  <div class="scaner">
  <ion-button class="btn-scanner" type="button" (click)="escanearDNI()">
    <ion-icon name="barcode-outline"></ion-icon>
    <p>ESCANEAR DNI</p>
  </ion-button>
</div>

  <!-- Fallback para navegador/escritorio -->
  <input #fileInput type="file" accept="image/*" capture="environment"
         class="file-hidden" (change)="onFileSelected($event)">
</div>


  <form class="register-form"
      (ngSubmit)="onSubmit(registerForm)"
      #registerForm="ngForm"
      novalidate>
<div class="form-group">
  <label for="apellido" class="subTittle">Apellido</label>
  <input id="apellido"
         name="apellido"
         type="text"
         [(ngModel)]="apellido"
         #apellidoModel="ngModel"
         required
         placeholder="Apellido" />
  <small *ngIf="showError(apellidoModel, registerForm)"
         style="color:#ffd1d1;font-weight:600;">
    El apellido es obligatorio.
  </small>
</div>
  <!-- Nombre -->
  <div class="form-group">
    <label for="username" class="subTittle">Nombre</label>
    <input id="username"
           name="username"
           type="text"
           [(ngModel)]="username"
           #usernameModel="ngModel"
           required
           placeholder="Nombre" />
    <small *ngIf="showError(usernameModel, registerForm)"
           style="color:#ffd1d1;font-weight:600;">
      El nombre es obligatorio.
    </small>
  </div>

  <!-- DNI -->
  <div class="form-group">
    <label for="dni" class="subTittle">DNI</label>
    <input id="dni"
           name="dni"
           type="text"
           [(ngModel)]="dni"
           #dniModel="ngModel"
           required
           inputmode="numeric"
           pattern="^[0-9]{7,8}$"
           maxlength="8"
           placeholder="Sólo números (7–8 dígitos)" />
    <small *ngIf="showError(dniModel, registerForm)"
           style="color:#ffd1d1;font-weight:600;">
      Ingresá un DNI válido (7–8 dígitos).
    </small>
  </div>

  <!-- Correo -->
  <div class="form-group">
    <label for="email" class="subTittle">Correo</label>
    <input id="email"
           name="email"
           type="email"
           [(ngModel)]="email"
           #emailModel="ngModel"
           required
           email
           placeholder="correo@ejemplo.com" />
    <small *ngIf="showError(emailModel, registerForm)"
           style="color:#ffd1d1;font-weight:600;">
      Ingresá un correo válido.
    </small>
  </div>

  <!-- Contraseña -->
  <div class="form-group">
    <label for="password" class="subTittle">Contraseña</label>
    <input id="password"
           name="password"
           type="password"
           [(ngModel)]="password"
           #passwordModel="ngModel"
           required
           minlength="8"
           placeholder="Mínimo 8 caracteres" />
    <small *ngIf="showError(passwordModel, registerForm)"
           style="color:#ffd1d1;font-weight:600;">
      La contraseña debe tener al menos 8 caracteres.
    </small>
  </div>

  <!-- Confirmación -->
  <div class="form-group">
    <label for="confirm" class="subTittle">Repetir contraseña</label>
    <input id="confirm"
           name="confirm"
           type="password"
           [(ngModel)]="confirm"
           #confirmModel="ngModel"
           required
           minlength="8"
           placeholder="Vuelva a escribir la contraseña" />
    <small *ngIf="showError(confirmModel, registerForm)"
           style="color:#ffd1d1;font-weight:600;">
      Repetí la contraseña (mínimo 8 caracteres).
    </small>
    <small *ngIf="passwordsMismatch && (registerForm.submitted || confirmModel.touched)"
           style="color:#ffd1d1;font-weight:700;">
      Las contraseñas no coinciden.
    </small>
  </div>

  <!-- Botones -->
  <button type="submit" class="buttonLogin">
    {{ loading ? 'Registrando…' : 'Registrarse' }}
  </button>

  <!-- Error general -->
  <div *ngIf="errorMsg" style="margin-top:8px;color:#ffd1d1;font-weight:600;">
    {{ errorMsg }}
  </div>
</form>


</div>
