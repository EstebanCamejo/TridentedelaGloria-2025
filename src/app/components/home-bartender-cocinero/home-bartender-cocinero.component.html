<ion-header>
  <ion-toolbar style="--background: #5d2222; --color: #fff;">
    <ion-title style="text-align: center; font-weight: 700; text-transform: uppercase;">
      BIENVENIDO | {{ (nombre$ || '—') | uppercase }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="client-content">
  <div class="client-wrap" [class.anonimo]="true">
    <ion-grid fixed class="client-actions">
      <ion-row class="gap-y">
        <ion-col size="12">
          <ion-button
            *ngIf="perfil === 'cocinero'"
            expand="block"
            size="large"
            (click)="irAAgregarNuevoPlato()">
            <ion-icon slot="start" name="add-circle-outline"></ion-icon>
            AGREGAR NUEVO PLATO
          </ion-button>
          
          <ion-button
            *ngIf="perfil === 'bartender'"
            expand="block"
            size="large"
            (click)="irAAgregarNuevaBebida()">
            <ion-icon slot="start" name="add-circle-outline"></ion-icon>
            AGREGAR NUEVA BEBIDA
          </ion-button>
        </ion-col>
        <ion-col size="12">
          <ion-button
            *ngIf="perfil === 'cocinero'"
            expand="block"
            size="large"
            (click)="irAVerificarPendientesCocinero()">
            <ion-icon slot="start" name="list-circle-outline"></ion-icon>
            VERIFICAR PEDIDOS PENDIENTES
          </ion-button>
          
          <ion-button
            *ngIf="perfil === 'bartender'"
            expand="block"
            size="large"
            (click)="irAVerificarPendientesBartender()">
            <ion-icon slot="start" name="list-circle-outline"></ion-icon>
            VERIFICAR PEDIDOS PENDIENTES
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
