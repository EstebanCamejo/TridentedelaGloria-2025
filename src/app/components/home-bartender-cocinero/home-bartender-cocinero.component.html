<ion-content class="pa-4 client-content" fullscreen>
  <div class="bartender-cocinero-wrap">
    
    <ion-header class="client-header">
      <ion-toolbar>
        <div class="nav-pill">
          BIENVENIDO | {{ (nombre$ || '—') | uppercase }}
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content class="client-content" fullscreen>
      <div class="client-wrap">
        <div class="client-stack">
          <ion-button
            *ngIf="perfil === 'cocinero'"
            class="cta btn-scan"
            fill="solid"
            expand="block"
            size="large"
            (click)="irAAgregarNuevoPlato()"
          >
            <ion-icon slot="start" name="add-circle-outline"></ion-icon>
            AGREGAR NUEVO PLATO
          </ion-button>

        <ion-button
          *ngIf="perfil === 'bartender'"
          class="cta btn-history"
          fill="solid"
          expand="block"
          size="large"
          (click)="irAAgregarNuevaBebida()"
        >
          <ion-icon slot="start" name="add-circle-outline"></ion-icon>
          AGREGAR NUEVA BEBIDA
        </ion-button>

        <ion-button
          *ngIf="perfil === 'cocinero'"
          class="cta btn-pendientes"
          fill="solid"
          expand="block"
          size="large"
          (click)="irAVerificarPendientesCocinero()"
        >
          <ion-icon slot="start" name="list-circle-outline"></ion-icon>
          VERIFICAR PEDIDOS PENDIENTES
        </ion-button>

          <!-- <ion-button
          *ngIf="perfil === 'cocinero'"
            class="cta btn-pendientes"
            fill="solid"
            expand="block"
            size="large"
            color="secondary"
            (click)="irAVerificarPendientesCocinero()"
          >
            <ion-icon slot="start" name="list-circle-outline"></ion-icon>
            Verificar pedidos pendientes
          </ion-button> -->

          <!-- <ion-button
            *ngIf="perfil === 'bartender'"
            class="cta btn-pendientes"
            fill="solid"
            expand="block"
            size="large"
            color="secondary"
            (click)="irAVerificarPendientesBartender()"
          >
            <ion-icon slot="start" name="list-circle-outline"></ion-icon>
            Verificar pedidos pendientes
          </ion-button> -->
          <ion-button
            *ngIf="perfil === 'bartender'"
            class="cta btn-pendientes"
            fill="solid"
            expand="block"
            size="large"
            (click)="irAVerificarPendientesBartender()"
          >
            <ion-icon slot="start" name="list-circle-outline"></ion-icon>
            VERIFICAR PEDIDOS PENDIENTES
          </ion-button>

      </div>

  </div>
</ion-content>
