<ion-header>
  <ion-toolbar style="--background:#5d2222; --color:#fff">
    <ion-title>CLIENTES PENDIENTES</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="pend-content" [fullscreen]="true">
  <!-- Pull to refresh -->
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pullingIcon="refresh"
      pullingText="DESLIZÁ PARA ACTUALIZAR"
      refreshingSpinner="lines"
      refreshingText="ACTUALIZANDO...">
    </ion-refresher-content>
  </ion-refresher>

  <!-- Search (sticky bajo el header) -->
<ion-searchbar
  class="pend-search search--maroon"   
  mode="md"                          
  placeholder="BUSCAR POR NOMBRE O CORREO"
  (ionInput)="search($event.detail.value || '')"
  debounce="300">
</ion-searchbar>
  <!-- Lista -->
  <ion-list class="pend-list" *ngIf="!loading && filtered.length; else estado">
    <ion-item class="pend-item" *ngFor="let it of filtered">
      <ion-avatar slot="start">
        <img [src]="it.foto_url || 'assets/imagenes/agregar-usuario.png'" alt="foto" />
      </ion-avatar>

<ion-label>
  <h2 class="name">{{ it.nombres }} {{ it.apellidos }}</h2>
  <p class="email">{{ it.email }}</p>
  <div class="meta">
    <ion-badge color="medium">PENDIENTE</ion-badge>
    <br>
    <small>{{ it.created_at | date:'short' }}</small>
  </div>
</ion-label>

<!-- Aprobar (XL) -->
<ion-button
  slot="end"
  fill="clear"
  color="success"
  [disabled]="loading || loadingId === it.id"
  (click)="confirmarAprobacion(it)"
  aria-label="Aprobar"
  style="
    --padding-start:18px; --padding-end:18px;
    --padding-top:16px; --padding-bottom:16px;
    --border-radius:16px;
    margin-inline-start:8px;
  ">
  <ng-container *ngIf="loadingId === it.id; else approveIcon">
    <ion-spinner slot="icon-only" style="width:34px; height:34px;"></ion-spinner>
  </ng-container>
  <ng-template #approveIcon>
    <ion-icon name="checkmark-circle" slot="icon-only" style="font-size:36px;"></ion-icon>
  </ng-template>
</ion-button>

<!-- Rechazar (XL) -->
<ion-button
  slot="end"
  fill="clear"
  color="danger"
  [disabled]="loading || loadingId === it.id"
  (click)="confirmarRechazo(it)"
  aria-label="Rechazar"
  style="
    --padding-start:18px; --padding-end:18px;
    --padding-top:16px; --padding-bottom:16px;
    --border-radius:16px;
    margin-inline-start:6px;
  ">
  <ng-container *ngIf="loadingId === it.id; else rejectIcon">
    <ion-spinner slot="icon-only" style="width:34px; height:34px;"></ion-spinner>
  </ng-container>
  <ng-template #rejectIcon>
    <ion-icon name="close-circle" slot="icon-only" style="font-size:36px;"></ion-icon>
  </ng-template>
</ion-button>



    </ion-item>
  </ion-list>

  <ng-template #estado>
    <div class="estado-ctr">
      <ng-container *ngIf="loading; else vacio">
        <p>CARGANDO PENDIENTES…</p>
      </ng-container>
      <ng-template #vacio>
        <p>NO HAY CLIENTES EN ESPERA</p>
        <ion-button size="small" (click)="load()">REFRESCAR</ion-button>
      </ng-template>
    </div>
  </ng-template>
</ion-content>
