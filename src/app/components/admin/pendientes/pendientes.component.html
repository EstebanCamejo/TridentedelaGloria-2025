<ion-header>
  <ion-toolbar>
    <ion-title>Clientes pendientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="loading" style="padding:16px; opacity:.7;">Cargando…</div>

  <ion-searchbar placeholder="Buscar por nombre o email" (ionInput)="search($event.detail.value)"></ion-searchbar>

  <ion-list *ngIf="!loading && filtered.length">
    <ion-item *ngFor="let it of filtered">
      <ion-avatar slot="start">
        <img *ngIf="it.foto_url" [src]="it.foto_url" alt="foto" />
        <div *ngIf="!it.foto_url"
             style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#333;color:#fff;border-radius:50%;">
          {{ (it.nombres || '?')[0] }}
        </div>
      </ion-avatar>

      <ion-label>
        <h3>{{ it.nombres }} {{ it.apellidos }}</h3>
        <p>{{ it.email }}</p>
      </ion-label>

      <ion-badge slot="end" color="warning">pendiente</ion-badge>

      <ion-button fill="clear" color="success" slot="end"
            (click)="approve(it); $event.stopPropagation()">
        <ion-icon name="checkmark-circle" slot="icon-only"></ion-icon>
      </ion-button>

      <ion-button fill="clear" color="danger" slot="end"
                  (click)="reject(it); $event.stopPropagation()">
        <ion-icon name="close-circle" slot="icon-only"></ion-icon>
      </ion-button>

    </ion-item>
  </ion-list>

  <div *ngIf="!loading && !filtered.length" style="padding:16px; opacity:.7;">
    No hay clientes pendientes.
  </div>
</ion-content>
