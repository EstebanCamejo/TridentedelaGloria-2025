<ion-header>
  <ion-toolbar style="--background: #5d2222; --color: #fff;">
    <ion-title style="text-align: center; font-weight: 700; text-transform: uppercase; width: 100%;">{{ mesaId ? 'EDITAR MESA #' + numero : 'ALTA DE MESA' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancelar()" style="--color: #fff; font-size: 24px; min-width: 44px;">✗</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="pa-4 alta-mesa-content">
  <div class="alta-mesa-form">
    <ion-item *ngIf="!mesaId" class="item-numero">
      <ion-input type="number"
                 [(ngModel)]="numero"
                 (ionInput)="updateBtnDisabled()"
                 placeholder="NÚMERO DE MESA (1-99)"
                 class="input-numero"></ion-input>
    </ion-item>

    <ion-item class="item-capacidad">
      <ion-input type="number"
                 [(ngModel)]="capacidad"
                 (ionInput)="updateBtnDisabled()"
                 placeholder="CAPACIDAD (1-12)"
                 class="input-capacidad"></ion-input>
    </ion-item>

    <ion-item class="item-tipo">
      <div class="tipo-label">TIPO:</div>
      <ion-select [(ngModel)]="tipo" 
                  (ionChange)="updateBtnDisabled(); onTipoSelectOpen()"
                  okText="✓"
                  cancelText="✗"
                  [placeholder]="tipo ? tipoTexto(tipo) : 'SELECCIONA UN TIPO'"
                  interface="popover"
                  class="select-tipo">
        <ion-select-option value="estandar">ESTÁNDAR</ion-select-option>
        <ion-select-option value="vip">EXCLUSIVA</ion-select-option>
        <ion-select-option value="mov_reducida">MOVILIDAD REDUCIDA</ion-select-option>
      </ion-select>
    </ion-item>

    <div *ngIf="!mesaId" class="foto-mesa-container">
      <div class="avatar-ctr" (click)="tomarFoto()">
        <img *ngIf="fotoPreview" [src]="fotoPreview" alt="" />
        <img *ngIf="!fotoPreview" src="assets/camera.png" alt="" class="camera-placeholder" />
      </div>
      <!-- Fallback navegador/escritorio -->
      <input #fileInput type="file" accept="image/*" capture="environment"
             class="file-hidden" (change)="onFileSelected($event)">
    </div>

    <div class="alta-mesa-actions">
      <ion-button
        expand="block"
        class="btn-guardar"
        [disabled]="btnDisabled"
        (click)="guardar()">
        <ion-icon name="save" slot="start"></ion-icon>
        {{ guardando ? 'GUARDANDO...' : 'GUARDAR MESA' }}
      </ion-button>
    </div>
  </div>
</ion-content>
