<ion-header>
  <ion-toolbar>
    <ion-title>Mesas</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="cargarMesas()">
        <ion-icon name="refresh"></ion-icon>
      </ion-button>
      <ion-button (click)="crearMesa()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="cargarMesas($event)">
    <ion-refresher-content refreshingSpinner="circles"></ion-refresher-content>
  </ion-refresher>

  <ion-list inset="true">
    <ion-item
      button
      detail
      *ngFor="let m of mesas; trackBy: trackById"
      (click)="editarMesa(m)"
    >
      <ion-avatar slot="start">
        <img [src]="m.foto_url || phSvg" alt="mesa" />
      </ion-avatar>

      <ion-label>
        <div class="row1">
          <span class="nro">Mesa #{{ m.numero }}</span>
          <ion-badge [color]="estadoColor(m.estado)">{{ m.estado }}</ion-badge>
        </div>
        <div class="row2">
          <span>Tipo: {{ m.tipo }}</span>
          <span>Cap: {{ m.capacidad }}</span>
        </div>
      </ion-label>

      <ion-buttons slot="end">
        <ion-button fill="clear" (click)="$event.stopPropagation(); editarMesa(m)">
          <ion-icon name="pencil"></ion-icon>
        </ion-button>
        <ion-button fill="clear" color="danger" (click)="$event.stopPropagation(); eliminarMesa(m)">
          <ion-icon name="trash"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>
</ion-content>
