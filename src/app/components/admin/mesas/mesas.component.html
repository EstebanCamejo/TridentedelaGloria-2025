<ion-header>
  <ion-toolbar style="--background: #5d2222; --color: #fff;">
    <ion-title style="text-align: center; font-weight: 700; text-transform: uppercase; width: 100%;">MESAS</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="mesas-content">
  <ion-refresher slot="fixed" (ionRefresh)="cargarMesas($event)">
    <ion-refresher-content refreshingSpinner="circles"></ion-refresher-content>
  </ion-refresher>

  <div class="mesas-header-actions">
    <ion-button class="btn-add-mesa" (click)="crearMesa()">
      <ion-icon name="add"></ion-icon>
      <span>AGREGAR MESA</span>
    </ion-button>
  </div>

  <div class="mesas-grid" *ngIf="!cargando && mesas.length > 0">
    <div class="mesa-card" *ngFor="let m of mesas; trackBy: trackById" (click)="mostrarOpcionesMesa(m)">
      <div class="mesa-card-photo">
        <img [src]="m.foto_url || phSvg" alt="Mesa {{ m.numero }}" />
      </div>
      
      <div class="mesa-card-content">
        <div class="mesa-card-header">
          <h2 class="mesa-numero">MESA #{{ m.numero }}</h2>
        </div>
        <div class="mesa-estado-container">
          <ion-badge [color]="estadoColor(m.estado)" class="mesa-estado">{{ estadoTexto(m.estado) }}</ion-badge>
        </div>
        
        <div class="mesa-card-info">
          <p class="mesa-tipo"><strong>{{ tipoTexto(m.tipo) }}</strong></p>
          <p class="mesa-capacidad"><strong>PLAZAS:</strong> {{ m.capacidad }}</p>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!cargando && mesas.length === 0" class="empty">
    <p>No hay mesas aún.</p>
    <ion-button size="small" (click)="crearMesa()">Crear mesa</ion-button>
  </div>
</ion-content>
