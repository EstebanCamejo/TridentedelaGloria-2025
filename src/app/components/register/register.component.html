<div class="register-container">
  <h2>Registrar usuario</h2>
  <form (ngSubmit)="onSubmit(registerForm)" #registerForm="ngForm">
    <div class="form-group">
      <label for="username">Nombre</label>
      <input
        type="text"
        id="username"
        name="username"
        class="form-control"
        ngModel
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Correo</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        class="form-control"
        ngModel
        required
        email
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        class="form-control"
        ngModel
        required
        minlength="8"
      />
    </div>

    <button
      type="submit"
      class="btn btn-primary"

    >
      Ingresar
    </button>
  </form>
</div>
