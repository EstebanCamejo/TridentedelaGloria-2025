<!-- CAMBIO: agregar [fullscreen]="true" -->
<ion-content [fullscreen]="true" class="pa-4">
  <div class="admin-wrap">
    <!-- <div class="client-header">
      <div class="nav-pill">PANEL ADMINISTRADOR</div>
    </div> -->
     
    <ion-header>
      <ion-toolbar style="--background: #5d2222; --color: #fff;">
        <ion-title style="text-align: center; font-weight: 700; text-transform: uppercase;">PANEL ADMINISTRADOR</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-grid fixed class="admin-actions">
      <ion-row class="gap-y">
        <ion-col size="12">
          <ion-button expand="block" size="large" (click)="irAListaDeEspera()">
            <ion-icon slot="start" name="checkmark-done-circle"></ion-icon>
            VERIFICACIÓN DE CLIENTES
          </ion-button>
        </ion-col>

        <ion-col size="12">
          <ion-button expand="block" size="large" color="secondary" (click)="irAAltas()">
            <ion-icon slot="start" name="person-add"></ion-icon>
            ALTAS
          </ion-button>
        </ion-col>

        <ion-col size="12">
          <ion-button expand="block" size="large" color="medium" (click)="irAResultados()">
            <ion-icon slot="start" name="stats-chart"></ion-icon>
            RESULTADOS DE ENCUESTAS
          </ion-button>
        </ion-col>

        <ion-col size="12">
          <ion-button expand="block" size="large" color="warning" (click)="irAReservas()">
            <ion-icon slot="start" name="calendar-outline"></ion-icon>
            GESTIONAR RESERVAS
          </ion-button>
        </ion-col>

        <ion-col size="12">
          <ion-button expand="block" size="large" color="success" (click)="irADelivery()">
            <ion-icon slot="start" name="bicycle-outline"></ion-icon>
            DELIVERY
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
