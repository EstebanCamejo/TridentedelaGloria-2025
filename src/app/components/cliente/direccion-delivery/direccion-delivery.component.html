<ion-header>
  <ion-toolbar>
    <ion-title>DIRECCIÓN DE ENTREGA</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancelar()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="direccion-container">
    <!-- Input de dirección -->
    <ion-item class="direccion-input-item">
      <ion-input 
        [(ngModel)]="direccion"
        placeholder="DIRECCION DE ENTREGA 123"
        required
        clearOnEdit="true"
        class="direccion-input-large">
      </ion-input>
    </ion-item>

    <!-- Mapa -->
    <div class="map-container">
      <div id="map-direccion"></div>
      <div class="map-instructions">
        <ion-icon name="location-outline"></ion-icon>
        <span>HACÉ CLIC EN EL MAPA O ARRASTRÁ EL MARCADOR PARA SELECCIONAR LA UBICACIÓN</span>
      </div>
    </div>

    <!-- Botones -->
    <div class="button-group">
      <ion-button 
        class="btn-cancelar"
        fill="clear"
        (click)="cancelar()">
        <ion-icon name="close-outline" slot="icon-only" class="icon-cancelar"></ion-icon>
      </ion-button>
      <ion-button 
        class="btn-confirmar"
        fill="clear"
        (click)="confirmar()">
        <ion-icon name="checkmark-outline" slot="icon-only" class="icon-confirmar"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
