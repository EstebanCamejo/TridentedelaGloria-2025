<ion-header>
  <ion-toolbar>
    <ion-title>Panel Maître</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid fixed>
    <ion-row>
      <ion-col size="12" sizeMd="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Operaciones</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-button expand="block" routerLink="/scan/mesa">
              <ion-icon slot="start" name="qrCode"></ion-icon>
              Escanear mesa
            </ion-button>

            <ion-button expand="block" routerLink="/maitre/lista-espera" color="medium" class="ion-margin-top">
              <ion-icon slot="start" name="list"></ion-icon>
              Lista de espera
            </ion-button>

            <!--
            <ion-button expand="block" routerLink="/maitre/asignar-mesa" color="tertiary" class="ion-margin-top">
              <ion-icon slot="start" name="personAdd"></ion-icon>
              Asignar mesa
            </ion-button>
            -->
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
