<ion-header>
  <ion-toolbar style="--background: #5d2222; --color: #fff;">
    <ion-title style="text-align: center; font-weight: 700; text-transform: uppercase;">
      BIENVENIDO | {{ (nombre || '—') | uppercase }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="client-content">
  <div class="client-wrap" [class.anonimo]="true">
    <ion-grid fixed class="client-actions">
      <ion-row class="gap-y">
        <ion-col size="12">
          <ion-button expand="block" size="large" routerLink="/registro-cliente">
            <ion-icon slot="start" name="person-add-outline"></ion-icon>
            CREAR CLIENTE
          </ion-button>
        </ion-col>
        <ion-col size="12">
          <ion-button expand="block" size="large" routerLink="/maitre/lista-espera">
            <ion-icon slot="start" name="reorder-three-outline"></ion-icon>
            LISTA DE ESPERA
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
