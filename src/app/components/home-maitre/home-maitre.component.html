<div class="bartender-cocinero-wrap">
  <ion-header class="client-header">
    <ion-toolbar>
      <div class="nav-pill">
        BIENVENIDO | {{ (nombre || '—') | uppercase }}
      </div>
    </ion-toolbar>
  </ion-header>

  <ion-content class="client-content" fullscreen>
    <div class="client-wrap">
      <div class="client-stack">
        <ion-button
          class="cta btn-scan"
          fill="solid"
          expand="block"
          size="large"
          routerLink="/registro-cliente"
        >
          <ion-icon slot="start" name="person-add-outline"></ion-icon>
          CREAR CLIENTE
        </ion-button>

        <ion-button
          class="cta btn-pendientes"
          fill="solid"
          expand="block"
          size="large"
          routerLink="/maitre/lista-espera"
        >
          <ion-icon slot="start" name="reorder-three-outline"></ion-icon>
          LISTA DE ESPERA
        </ion-button>
      </div>
    </div>
  </ion-content>
</div>
