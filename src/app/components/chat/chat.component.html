<ion-header class="chat-header">
  <ion-toolbar>
    <ion-title class="title-large">
      <span *ngIf="esDeliveryChat && esModoDelivery">CHAT CON CLIENTE</span>
      <span *ngIf="esDeliveryChat && !esModoDelivery">CHAT CON REPARTIDOR</span>
      <span *ngIf="!esDeliveryChat">CHAT CON MOZO</span>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-content">
  <div class="list">
    <ng-container *ngIf="mensajes?.length; else vacio">
      <div *ngFor="let m of mensajes" class="bubble" [class.mine]="soyYo(m)">
        <div class="meta" *ngIf="obtenerMetaTexto(m)">{{ obtenerMetaTexto(m) }}</div>
        <div class="text">{{ m.text }}</div>
        <div class="time">{{ m.created_at | date:'dd/MM HH:mm' }}</div>
      </div>
      <div #bottom></div>
    </ng-container>
    <ng-template #vacio>
      <div class="empty">
        <div class="empty-message">
          <div class="empty-icon">💬</div>
          <div class="empty-title">¡CHAT VACÍO!</div>
        </div>
      </div>
    </ng-template>
  </div>

  <!-- footer visual fijo -->
  <div class="composer-footer" slot="fixed">
    <div class="composer">
      <input [(ngModel)]="nuevo" (focus)="scrollDownSoon()" placeholder="ESCRIBÍ TU MENSAJE…" />
      <button class="send-btn" (click)="enviar()" [disabled]="!nuevo.trim()">
        <ion-icon name="send-outline"></ion-icon>
      </button>
    </div>
  </div>
</ion-content>
