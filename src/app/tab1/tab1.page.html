<ion-header>
  <ion-toolbar>
    <ion-title class="tittle"> Login </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div class="wrapper">
    <div class="card">
      <h1 class="tittle">Ingrese credenciales</h1>
      <div>
        <h5 class="subTittle">Correo</h5>
        <input type="text" placeholder="Email" [(ngModel)]="email" />
        <h5 class="subTittle">Contraseña</h5>
        <input
          type="password"
          placeholder="Contraseña"
          [(ngModel)]="password"
        />
      </div>
      <button (click)="login()" class="buttonLogin">Login</button>
    </div>
  </div>
</ion-content>
